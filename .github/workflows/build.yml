name: Build WebDAV APK

# 只需手动触发。补丁从仓库里的 lyrico-webdav.patch 读取并应用。
on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建类型（debug 可与官方版共存）'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 拉取本仓库（含 submodule）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK 组件
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;4.1.2"

      - name: 应用 WebDAV 补丁
        run: |
          if [ ! -f lyrico-webdav.patch ]; then
            echo "::error::仓库里找不到 lyrico-webdav.patch"
            exit 1
          fi
          git apply --verbose lyrico-webdav.patch
          echo "--- 补丁已应用，新增文件： ---"
          ls -1 lyrico-app/src/main/java/com/lonx/lyrico/data/webdav/

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 构建 APK
        run: |
          chmod +x ./gradlew
          ./gradlew :lyrico-app:assemble${{ github.event.inputs.variant }} \
            --no-daemon --stacktrace

      - name: 显示产物
        run: find lyrico-app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: lyrico-apk-${{ github.event.inputs.variant }}
          path: lyrico-app/build/outputs/apk/**/*.apk
          retention-days: 30
